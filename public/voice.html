<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>교실 보이스 패드 — 무지연 0초 수업 음성 도우미</title>
<style>
  :root {
    --bg: #f4f6fb;
    --card: #ffffff;
    --ink: #0f172a;
    --muted: #64748b;
    --border: #e2e8f0;
    --primary: #2563eb;
    --primary-dark: #1d4ed8;
    --primary-soft: #eff6ff;
    --amber: #d97706;
    --amber-soft: #fffbeb;
    --danger: #dc2626;
    --radius: 16px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.45;
  }
  .wrap {
    max-width: 1180px;
    margin: 0 auto;
    padding: 18px 20px 48px;
  }

  /* ===== 상단 헤더 & 차임벨·설정 통합 바 ===== */
  .topbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 20px;
    margin-bottom: 16px;
    box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .brand h1 {
    margin: 0;
    font-size: 20px;
    font-weight: 800;
    letter-spacing: -0.3px;
  }
  .badge-zero {
    background: #dcfce7;
    color: #15803d;
    font-size: 12px;
    font-weight: 800;
    padding: 4px 10px;
    border-radius: 999px;
  }
  .home-link {
    text-decoration: none;
    color: var(--muted);
    font-size: 13px;
    font-weight: 700;
    padding: 6px 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: #f8fafc;
  }
  .home-link:hover { background: #f1f5f9; color: var(--ink); }

  /* 차임벨 3종 + 자동 차임벨 */
  .bell-bar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
  }
  .bell-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 10px 15px;
    border-radius: 12px;
    border: 1.5px solid #fcd34d;
    background: var(--amber-soft);
    color: #92400e;
    font: inherit;
    font-size: 14px;
    font-weight: 800;
    cursor: pointer;
    transition: transform 0.08s, background 0.15s;
  }
  .bell-btn:hover { background: #fef3c7; }
  .bell-btn:active, .bell-btn.active { transform: scale(0.96); background: #fde68a; }

  .chime-toggle {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 10px 14px;
    border-radius: 12px;
    border: 1.5px solid var(--border);
    background: #fff;
    color: var(--muted);
    font: inherit;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }
  .chime-toggle.on {
    border-color: var(--amber);
    background: #d97706;
    color: #fff;
  }

  /* ===== 메인 즉석 입력 & 전광판 영역 ===== */
  .hero-speak {
    background: var(--card);
    border: 2px solid #cbd5e1;
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 18px;
    box-shadow: 0 4px 16px rgba(37, 99, 235, 0.06);
  }
  .input-row {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }
  .input-wrap {
    position: relative;
    flex: 1 1 360px;
  }
  #quickInput {
    width: 100%;
    height: 60px;
    padding: 0 84px 0 18px;
    font: inherit;
    font-size: 21px;
    font-weight: 700;
    color: var(--ink);
    background: #f8fafc;
    border: 2px solid #cbd5e1;
    border-radius: 14px;
    outline: none;
    transition: border-color 0.15s, background 0.15s;
  }
  #quickInput:focus {
    border-color: var(--primary);
    background: #fff;
  }
  .clear-btn {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    border: none;
    background: #e2e8f0;
    color: #475569;
    font: inherit;
    font-size: 13px;
    font-weight: 700;
    padding: 6px 12px;
    border-radius: 8px;
    cursor: pointer;
  }
  .clear-btn:hover { background: #cbd5e1; }

  .speak-btn {
    height: 60px;
    padding: 0 28px;
    border-radius: 14px;
    border: none;
    background: var(--primary);
    color: #fff;
    font: inherit;
    font-size: 18px;
    font-weight: 800;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    white-space: nowrap;
    transition: background 0.15s, transform 0.08s;
  }
  .speak-btn:hover { background: var(--primary-dark); }
  .speak-btn:active { transform: scale(0.98); }

  .save-btn {
    height: 60px;
    padding: 0 20px;
    border-radius: 14px;
    border: 2px solid var(--border);
    background: #fff;
    color: var(--ink);
    font: inherit;
    font-size: 15px;
    font-weight: 800;
    cursor: pointer;
    white-space: nowrap;
  }
  .save-btn:hover { background: #f8fafc; border-color: #94a3b8; }

  /* 칠판 전광판 배너 (현재 말하고 있는 문장 크게 표시) */
  .live-board {
    margin-top: 14px;
    background: #0f172a;
    color: #fff;
    border-radius: 14px;
    padding: 16px 20px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .live-board.speaking {
    background: #1e3a8a;
    outline: 3px solid #60a5fa;
  }
  .live-text-wrap {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
    flex: 1;
  }
  .status-dot {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #64748b;
    flex-shrink: 0;
  }
  .live-board.speaking .status-dot {
    background: #22c55e;
    box-shadow: 0 0 12px #22c55e;
    animation: pulse 0.9s infinite alternate;
  }
  @keyframes pulse { from { transform: scale(0.9); opacity: 0.7; } to { transform: scale(1.2); opacity: 1; } }

  .live-text {
    font-size: clamp(20px, 2.5vw, 28px);
    font-weight: 800;
    letter-spacing: -0.3px;
    word-break: keep-all;
  }
  .live-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }
  .mini-btn {
    padding: 9px 14px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.25);
    background: rgba(255,255,255,0.12);
    color: #fff;
    font: inherit;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
  }
  .mini-btn:hover { background: rgba(255,255,255,0.22); }
  .mini-btn.stop { background: #dc2626; border-color: #ef4444; }

  /* 최근 말한 기록 칩 (한 줄로 심플하게) */
  .history-row {
    margin-top: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .history-label {
    font-size: 13px;
    font-weight: 700;
    color: var(--muted);
    margin-right: 2px;
  }
  .hist-chip {
    border: 1px solid var(--border);
    background: #f8fafc;
    color: #334155;
    padding: 6px 12px;
    border-radius: 999px;
    font: inherit;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.12s;
  }
  .hist-chip:hover {
    border-color: var(--primary);
    background: var(--primary-soft);
    color: var(--primary-dark);
  }

  /* ===== 목소리 & 속도 설정 한 줄 컨트롤 바 ===== */
  .settings-bar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 18px;
    margin-bottom: 18px;
    font-size: 14px;
  }
  .setting-group {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
  }
  .setting-group label {
    font-weight: 800;
    color: #334155;
  }
  select#voiceSelect {
    font: inherit;
    font-size: 14px;
    font-weight: 700;
    padding: 8px 12px;
    border-radius: 10px;
    border: 1.5px solid var(--border);
    background: #f8fafc;
    color: var(--ink);
    max-width: 300px;
  }
  .speed-pills, .pitch-pills {
    display: inline-flex;
    background: #f1f5f9;
    padding: 3px;
    border-radius: 10px;
    gap: 2px;
  }
  .pill-btn {
    border: none;
    background: transparent;
    color: #475569;
    font: inherit;
    font-size: 13px;
    font-weight: 800;
    padding: 6px 11px;
    border-radius: 8px;
    cursor: pointer;
  }
  .pill-btn.active {
    background: var(--ink);
    color: #fff;
  }

  /* ===== 카테고리 탭 & 원터치 큰 버튼 그리드 ===== */
  .toolbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 14px;
  }
  .cat-tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .cat-tab {
    padding: 10px 18px;
    border-radius: 999px;
    border: 1.5px solid var(--border);
    background: var(--card);
    color: #475569;
    font: inherit;
    font-size: 15px;
    font-weight: 800;
    cursor: pointer;
    transition: 0.12s;
  }
  .cat-tab:hover { background: #f8fafc; color: var(--ink); }
  .cat-tab.active {
    background: var(--primary);
    border-color: var(--primary);
    color: #fff;
  }

  .reset-link {
    border: none;
    background: none;
    color: var(--muted);
    font: inherit;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    text-decoration: underline;
  }

  .phrase-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 12px;
  }
  .phrase-card {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 20px;
    cursor: pointer;
    user-select: none;
    transition: transform 0.08s, border-color 0.12s, box-shadow 0.12s;
  }
  .phrase-card:hover {
    border-color: #93c5fd;
    box-shadow: 0 4px 12px rgba(37, 99, 235, 0.08);
    transform: translateY(-1px);
  }
  .phrase-card:active {
    transform: scale(0.985);
  }
  .phrase-card.speaking {
    border-color: var(--primary);
    background: var(--primary-soft);
  }
  .phrase-main {
    flex: 1;
    min-width: 0;
  }
  .phrase-cat-tag {
    display: inline-block;
    font-size: 11px;
    font-weight: 800;
    color: var(--primary);
    background: #dbeafe;
    padding: 2px 8px;
    border-radius: 6px;
    margin-bottom: 6px;
  }
  .phrase-text {
    margin: 0;
    font-size: 19px;
    font-weight: 800;
    color: var(--ink);
    word-break: keep-all;
  }
  .card-tools {
    display: flex;
    flex-direction: column;
    gap: 4px;
    flex-shrink: 0;
  }
  .icon-btn {
    border: 1px solid transparent;
    background: #f8fafc;
    color: #94a3b8;
    width: 32px;
    height: 32px;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .icon-btn:hover { background: #e2e8f0; color: var(--ink); }
  .icon-btn.pinned { color: var(--primary); background: #dbeafe; }
  .icon-btn.del:hover { background: #fee2e2; color: var(--danger); }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%) translateY(20px);
    background: #0f172a;
    color: #fff;
    padding: 12px 22px;
    border-radius: 999px;
    font-size: 15px;
    font-weight: 800;
    opacity: 0;
    pointer-events: none;
    transition: 0.2s;
    z-index: 99;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
</style>
</head>
<body>

<div class="wrap">
  <!-- 1. 상단 바: 타이틀 + 주의 집중 차임벨 3종 -->
  <header class="topbar">
    <div class="brand">
      <a href="/" class="home-link">🏠 홈으로</a>
      <h1>📢 교실 보이스 패드</h1>
      <span class="badge-zero">⚡ 0초 즉시 발화</span>
    </div>

    <div class="bell-bar">
      <button type="button" class="bell-btn" data-sound="chime">🔔 수업 차임벨 (딩동댕동)</button>
      <button type="button" class="bell-btn" data-sound="bell">🛎️ 주목 종소리 (탁상벨)</button>
      <button type="button" class="bell-btn" data-sound="timer">🎵 활동 종료음</button>
      <button type="button" id="preChimeBtn" class="chime-toggle">🔕 말하기 전 자동 벨: 꺼짐</button>
    </div>
  </header>

  <!-- 2. 즉석 한마디 입력창 & 칠판 전광판 -->
  <section class="hero-speak">
    <form id="speakForm" class="input-row">
      <div class="input-wrap">
        <input
          type="text"
          id="quickInput"
          placeholder="하고 싶은 말을 입력하고 Enter를 누르세요 (대기 시간 0초)"
          autocomplete="off"
        />
        <button type="button" id="clearBtn" class="clear-btn" hidden>지우기</button>
      </div>
      <button type="submit" class="speak-btn">🔊 바로 말하기 (Enter)</button>
      <button type="button" id="savePhraseBtn" class="save-btn">➕ 아래 버튼에 추가</button>
    </form>

    <!-- 현재 읽는 문장 전광판 -->
    <div class="live-board" id="liveBoard">
      <div class="live-text-wrap">
        <span class="status-dot"></span>
        <span class="live-text" id="liveText">자, 지금부터 선생님 화면을 함께 봅시다!</span>
      </div>
      <div class="live-actions">
        <button type="button" id="replayBtn" class="mini-btn">🔄 다시 말하기</button>
        <button type="button" id="stopBtn" class="mini-btn stop">⏹ 멈춤</button>
      </div>
    </div>

    <!-- 최근 말한 문구 원터치 재실행 -->
    <div class="history-row" id="historyRow">
      <span class="history-label">🕘 최근 말한 문구:</span>
    </div>
  </section>

  <!-- 3. 목소리 & 속도 설정 바 (한 줄 압축) -->
  <section class="settings-bar">
    <div class="setting-group">
      <label for="voiceSelect">🎙️ 목소리:</label>
      <select id="voiceSelect"></select>
    </div>

    <div class="setting-group">
      <label>⚡ 말하기 속도:</label>
      <div class="speed-pills" id="speedPills">
        <button type="button" class="pill-btn" data-rate="0.9">0.9x</button>
        <button type="button" class="pill-btn active" data-rate="1.0">1.0x</button>
        <button type="button" class="pill-btn" data-rate="1.1">1.1x</button>
        <button type="button" class="pill-btn" data-rate="1.2">1.2x</button>
        <button type="button" class="pill-btn" data-rate="1.3">1.3x</button>
      </div>
    </div>

    <div class="setting-group">
      <label>🎵 목소리 톤:</label>
      <div class="pitch-pills" id="pitchPills">
        <button type="button" class="pill-btn" data-pitch="0.85">낮고 차분하게</button>
        <button type="button" class="pill-btn active" data-pitch="1.0">기본 톤</button>
        <button type="button" class="pill-btn" data-pitch="1.15">밝고 또렷하게</button>
      </div>
    </div>
  </section>

  <!-- 4. 카테고리 탭 & 원터치 상용구 큰 버튼 보드 -->
  <div class="toolbar">
    <div class="cat-tabs" id="catTabs">
      <button type="button" class="cat-tab active" data-cat="all">⭐ 전체 문구</button>
      <button type="button" class="cat-tab" data-cat="start">👋 수업 시작·양해</button>
      <button type="button" class="cat-tab" data-cat="focus">🤫 집중·조용히</button>
      <button type="button" class="cat-tab" data-cat="task">✏️ 학습·활동 안내</button>
      <button type="button" class="cat-tab" data-cat="praise">👏 칭찬·마무리</button>
    </div>
    <button type="button" id="resetDefaultBtn" class="reset-link">기본 문구로 초기화</button>
  </div>

  <div class="phrase-grid" id="phraseGrid"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const STORAGE_PHRASES = "sw_voice_pad_phrases_v1";
const STORAGE_SETTINGS = "sw_voice_pad_settings_v1";
const STORAGE_HISTORY = "sw_voice_pad_history_v1";

const CAT_NAMES = {
  start: "수업 시작",
  focus: "집중·정숙",
  task: "학습 안내",
  praise: "칭찬·마무리"
};

const DEFAULT_PHRASES = [
  { id: "p1", cat: "start", pinned: true, text: "선생님이 오늘 목이 많이 쉬었어. 조금만 조용히 하고 잘 들어주자." },
  { id: "p2", cat: "start", pinned: true, text: "모두 자리에 바르게 앉아서 수업 준비를 마쳐 주세요." },
  { id: "p3", cat: "focus", pinned: true, text: "잠시 하던 걸 멈추고 앞에 화면을 봐 주세요." },
  { id: "p4", cat: "focus", pinned: true, text: "목소리를 조금만 낮춰서 이야기해 볼까요?" },
  { id: "p5", cat: "task", pinned: true, text: "자, 지금부터 학습지 풀자." },
  { id: "p6", cat: "task", pinned: true, text: "짝꿍과 이야기 나누어 보자." },
  { id: "p7", cat: "task", pinned: false, text: "다 푼 사람은 손들지 말고 조용히 다음 문제를 확인하세요." },
  { id: "p8", cat: "task", pinned: false, text: "다 푼 사람은 손들어 볼까?" },
  { id: "p9", cat: "task", pinned: false, text: "이름 꼭 적어서 제출하자." },
  { id: "p10", cat: "focus", pinned: false, text: "조용히 하고 앞에 보자." },
  { id: "p11", cat: "task", pinned: false, text: "모둠별로 역할을 나누어 활동을 시작해 보세요." },
  { id: "p12", cat: "task", pinned: false, text: "활동 시간이 1분 남았습니다. 마무리해 주세요." },
  { id: "p13", cat: "praise", pinned: false, text: "오늘 선생님이 목이 아픈데도 다들 집중해서 잘 참여해 줘서 고마워." },
  { id: "p14", cat: "praise", pinned: false, text: "오늘 수업은 여기까지 할게요. 자리 정돈하고 쉬는 시간 가지세요." }
];

let phrases = loadJson(STORAGE_PHRASES, DEFAULT_PHRASES);
let settings = loadJson(STORAGE_SETTINGS, { voiceURI: "", rate: 1.0, pitch: 1.0, preChime: false });
let historyList = loadJson(STORAGE_HISTORY, [
  "조용히 하고 앞에 보자.",
  "자, 지금부터 학습지 풀자.",
  "선생님이 오늘 목이 많이 쉬었어. 조금만 조용히 하고 잘 들어주자."
]);
let currentCat = "all";
let lastSpoken = "자, 지금부터 선생님 화면을 함께 봅시다!";
let activeSpeaking = "";
let audioCtx = null;

function loadJson(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  } catch {
    return fallback;
  }
}
function saveJson(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch {}
}
function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove("show"), 1800);
}

/* ===== 무지연 Web Audio 차임벨/종소리 합성기 ===== */
function getAudioCtx() {
  if (!audioCtx) {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    audioCtx = new Ctx();
  }
  if (audioCtx.state === "suspended") audioCtx.resume();
  return audioCtx;
}

function playSoundEffect(type) {
  return new Promise((resolve) => {
    try {
      const ctx = getAudioCtx();
      const now = ctx.currentTime;
      const playTone = (freq, start, dur, gainVal = 0.24, wave = "sine") => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = wave;
        osc.frequency.setValueAtTime(freq, start);
        gain.gain.setValueAtTime(0.0001, start);
        gain.gain.exponentialRampToValueAtTime(gainVal, start + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, start + dur);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(start);
        osc.stop(start + dur + 0.02);
      };
      if (type === "chime") {
        playTone(523.25, now, 0.35, 0.22, "triangle");
        playTone(659.25, now + 0.20, 0.35, 0.22, "triangle");
        playTone(783.99, now + 0.40, 0.35, 0.22, "triangle");
        playTone(1046.5, now + 0.60, 0.60, 0.26, "sine");
        setTimeout(resolve, 1050);
      } else if (type === "bell") {
        playTone(880, now, 0.26, 0.28, "sine");
        playTone(1760, now, 0.16, 0.1, "triangle");
        playTone(1318.5, now + 0.20, 0.50, 0.28, "sine");
        playTone(2637, now + 0.20, 0.28, 0.1, "triangle");
        setTimeout(resolve, 650);
      } else {
        playTone(587.33, now, 0.45, 0.2, "sine");
        playTone(880.0, now + 0.08, 0.55, 0.2, "sine");
        playTone(1174.66, now + 0.16, 0.70, 0.24, "sine");
        setTimeout(resolve, 750);
      }
    } catch {
      resolve();
    }
  });
}

/* ===== 브라우저 내장 한국어 음성 목록 불러오기 ===== */
const voiceSelect = document.getElementById("voiceSelect");
let availableVoices = [];

function populateVoices() {
  if (!("speechSynthesis" in window)) return;
  const all = window.speechSynthesis.getVoices();
  const koVoices = all.filter((v) => v.lang && (v.lang.toLowerCase().includes("ko") || v.name.includes("Korean") || v.name.includes("한국")));
  availableVoices = koVoices.length > 0 ? koVoices : all;

  // 자연스러운 음성(Microsoft Online Natural / Google 한국의) 우선 정렬
  availableVoices.sort((a, b) => {
    const score = (v) =>
      (v.name.includes("Natural") || v.name.includes("Online") ? 4 : 0) +
      (v.name.includes("SunHi") || v.name.includes("InJoon") || v.name.includes("Google") ? 2 : 0);
    return score(b) - score(a);
  });

  voiceSelect.innerHTML = "";
  availableVoices.forEach((v) => {
    const opt = document.createElement("option");
    opt.value = v.voiceURI;
    opt.textContent = `${v.name} (${v.lang})`;
    voiceSelect.appendChild(opt);
  });

  if (settings.voiceURI && availableVoices.some((v) => v.voiceURI === settings.voiceURI)) {
    voiceSelect.value = settings.voiceURI;
  } else if (availableVoices[0]) {
    settings.voiceURI = availableVoices[0].voiceURI;
    voiceSelect.value = settings.voiceURI;
  }
}

if ("speechSynthesis" in window) {
  populateVoices();
  window.speechSynthesis.onvoiceschanged = populateVoices;
}

voiceSelect.addEventListener("change", () => {
  settings.voiceURI = voiceSelect.value;
  saveJson(STORAGE_SETTINGS, settings);
  speakNow(lastSpoken);
});

/* ===== 0초 즉시 말하기 핵심 함수 ===== */
async function speakNow(rawText) {
  const text = (rawText || "").trim();
  if (!text) return;

  if ("speechSynthesis" in window) {
    window.speechSynthesis.cancel();
  }

  lastSpoken = text;
  activeSpeaking = text;
  document.getElementById("liveText").textContent = `“${text}”`;
  document.getElementById("liveBoard").classList.add("speaking");

  // 최근 기록 업데이트
  historyList = [text, ...historyList.filter((item) => item !== text)].slice(0, 8);
  saveJson(STORAGE_HISTORY, historyList);
  renderHistory();
  renderPhrases();

  if (settings.preChime) {
    await playSoundEffect("chime");
  }

  if (!("speechSynthesis" in window)) {
    toast("이 브라우저는 음성 합성을 지원하지 않습니다.");
    return;
  }

  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = "ko-KR";
  utter.rate = Number(settings.rate) || 1.0;
  utter.pitch = Number(settings.pitch) || 1.0;

  const chosen = availableVoices.find((v) => v.voiceURI === settings.voiceURI);
  if (chosen) utter.voice = chosen;

  const clearState = () => {
    activeSpeaking = "";
    document.getElementById("liveBoard").classList.remove("speaking");
    renderPhrases();
  };
  utter.onend = clearState;
  utter.onerror = clearState;

  window.speechSynthesis.speak(utter);
}

function stopSpeaking() {
  if ("speechSynthesis" in window) {
    window.speechSynthesis.cancel();
  }
  activeSpeaking = "";
  document.getElementById("liveBoard").classList.remove("speaking");
  renderPhrases();
}

/* ===== UI 렌더링 ===== */
function renderHistory() {
  const row = document.getElementById("historyRow");
  row.innerHTML = `<span class="history-label">🕘 최근 말한 문구 (클릭 시 즉시 재생):</span>`;
  historyList.forEach((txt) => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "hist-chip";
    btn.textContent = txt;
    btn.addEventListener("click", () => speakNow(txt));
    row.appendChild(btn);
  });
}

function renderPhrases() {
  const grid = document.getElementById("phraseGrid");
  const list = phrases
    .filter((p) => currentCat === "all" || p.cat === currentCat)
    .sort((a, b) => (a.pinned === b.pinned ? 0 : a.pinned ? -1 : 1));

  grid.innerHTML = "";
  list.forEach((item) => {
    const card = document.createElement("div");
    card.className = "phrase-card" + (activeSpeaking === item.text ? " speaking" : "");
    card.innerHTML = `
      <div class="phrase-main">
        <span class="phrase-cat-tag">${item.pinned ? "📌 고정 · " : ""}${CAT_NAMES[item.cat] || "수업 문구"}</span>
        <p class="phrase-text">“${item.text}”</p>
      </div>
      <div class="card-tools">
        <button type="button" class="icon-btn ${item.pinned ? "pinned" : ""}" data-act="pin" title="상단 고정">📌</button>
        <button type="button" class="icon-btn del" data-act="del" title="삭제">✕</button>
      </div>
    `;
    card.addEventListener("click", (e) => {
      const actBtn = e.target.closest("button[data-act]");
      if (actBtn) {
        e.stopPropagation();
        const act = actBtn.dataset.act;
        if (act === "pin") {
          item.pinned = !item.pinned;
          saveJson(STORAGE_PHRASES, phrases);
          renderPhrases();
        } else if (act === "del") {
          phrases = phrases.filter((p) => p.id !== item.id);
          saveJson(STORAGE_PHRASES, phrases);
          renderPhrases();
          toast("문구를 삭제했습니다");
        }
        return;
      }
      speakNow(item.text);
    });
    grid.appendChild(card);
  });
}

/* ===== 이벤트 바인딩 ===== */
const quickInput = document.getElementById("quickInput");
const clearBtn = document.getElementById("clearBtn");

quickInput.addEventListener("input", () => {
  clearBtn.hidden = !quickInput.value;
});
clearBtn.addEventListener("click", () => {
  quickInput.value = "";
  clearBtn.hidden = true;
  quickInput.focus();
});

document.getElementById("speakForm").addEventListener("submit", (e) => {
  e.preventDefault();
  if (!quickInput.value.trim()) return;
  speakNow(quickInput.value);
});

document.getElementById("savePhraseBtn").addEventListener("click", () => {
  const txt = quickInput.value.trim();
  if (!txt) {
    toast("먼저 입력창에 추가할 문구를 적어주세요");
    quickInput.focus();
    return;
  }
  const targetCat = currentCat === "all" ? "task" : currentCat;
  phrases.unshift({
    id: "p-" + Date.now(),
    cat: targetCat,
    pinned: true,
    text: txt
  });
  saveJson(STORAGE_PHRASES, phrases);
  renderPhrases();
  toast("아래 상용구 버튼에 추가되었습니다!");
});

document.getElementById("replayBtn").addEventListener("click", () => speakNow(lastSpoken));
document.getElementById("stopBtn").addEventListener("click", stopSpeaking);

document.querySelectorAll(".bell-btn").forEach((btn) => {
  btn.addEventListener("click", async () => {
    btn.classList.add("active");
    await playSoundEffect(btn.dataset.sound);
    btn.classList.remove("active");
  });
});

const preChimeBtn = document.getElementById("preChimeBtn");
function updatePreChimeUI() {
  preChimeBtn.classList.toggle("on", !!settings.preChime);
  preChimeBtn.textContent = settings.preChime ? "🔔 말하기 전 자동 벨: 켜짐" : "🔕 말하기 전 자동 벨: 꺼짐";
}
updatePreChimeUI();
preChimeBtn.addEventListener("click", () => {
  settings.preChime = !settings.preChime;
  saveJson(STORAGE_SETTINGS, settings);
  updatePreChimeUI();
});

document.querySelectorAll("#speedPills .pill-btn").forEach((btn) => {
  if (Number(btn.dataset.rate) === Number(settings.rate)) {
    document.querySelectorAll("#speedPills .pill-btn").forEach((b) => b.classList.remove("active"));
    btn.classList.add("active");
  }
  btn.addEventListener("click", () => {
    settings.rate = Number(btn.dataset.rate);
    saveJson(STORAGE_SETTINGS, settings);
    document.querySelectorAll("#speedPills .pill-btn").forEach((b) => b.classList.remove("active"));
    btn.classList.add("active");
  });
});

document.querySelectorAll("#pitchPills .pill-btn").forEach((btn) => {
  if (Number(btn.dataset.pitch) === Number(settings.pitch)) {
    document.querySelectorAll("#pitchPills .pill-btn").forEach((b) => b.classList.remove("active"));
    btn.classList.add("active");
  }
  btn.addEventListener("click", () => {
    settings.pitch = Number(btn.dataset.pitch);
    saveJson(STORAGE_SETTINGS, settings);
    document.querySelectorAll("#pitchPills .pill-btn").forEach((b) => b.classList.remove("active"));
    btn.classList.add("active");
  });
});

document.querySelectorAll("#catTabs .cat-tab").forEach((tab) => {
  tab.addEventListener("click", () => {
    currentCat = tab.dataset.cat;
    document.querySelectorAll("#catTabs .cat-tab").forEach((t) => t.classList.remove("active"));
    tab.classList.add("active");
    renderPhrases();
  });
});

document.getElementById("resetDefaultBtn").addEventListener("click", () => {
  phrases = [...DEFAULT_PHRASES];
  saveJson(STORAGE_PHRASES, phrases);
  renderPhrases();
  toast("기본 수업 문구로 복원되었습니다");
});

renderHistory();
renderPhrases();
</script>
</body>
